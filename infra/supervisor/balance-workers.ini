;--------------------------------------------------------------------
; Symfony Messenger workers para el proyecto balance
;
; Este fichero se versiona en el repositorio. En el servidor de
; producción se enlaza mediante un symlink desde /etc/supervisord.d/
; (ver infra/supervisor/README.md).
;
; Colas por prioridad (config/packages/messenger.yaml):
;   async_high -> queue_name=high
;   async      -> queue_name=medium
;   async_low  -> queue_name=low
;
; Cada worker consume su cola y, cuando está vacía, ayuda con las de
; menor prioridad (messenger:consume procesa los transportes en el
; orden indicado). La cola `low` tiene siempre un worker dedicado,
; por lo que ninguna cola queda sin consumidor garantizado.
;--------------------------------------------------------------------

[program:balance-worker-high]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/bioscore.info/balance.bioscore.info/bin/console messenger:consume async_high async async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/bioscore.info/balance.bioscore.info
user=bioscore.info_vtdmx4srwt
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/balance/messenger-high.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[program:balance-worker-medium]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/bioscore.info/balance.bioscore.info/bin/console messenger:consume async async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/bioscore.info/balance.bioscore.info
user=bioscore.info_vtdmx4srwt
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/balance/messenger-medium.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[program:balance-worker-low]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/bioscore.info/balance.bioscore.info/bin/console messenger:consume async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/bioscore.info/balance.bioscore.info
user=bioscore.info_vtdmx4srwt
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/balance/messenger-low.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[group:balance]
programs=balance-worker-high,balance-worker-medium,balance-worker-low
priority=999
