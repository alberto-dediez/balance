;--------------------------------------------------------------------
; Symfony Messenger workers para el proyecto Hydra
;
; Este fichero se versiona en el repositorio. En el servidor de
; producción se enlaza mediante un symlink desde /etc/supervisord.d/
;
; Plantilla: cada plataforma la copia a <grupo>-workers.ini y ajusta
; nombres, `user`, `directory`, rutas y logs con los valores reales
; del servidor (ver infra/supervisor/README.md).
;
; Colas por prioridad (config/packages/messenger.yaml):
;   async_high -> queue_name=high
;   async      -> queue_name=medium
;   async_low  -> queue_name=low
;
; Cada worker consume su cola y, cuando está vacía, ayuda con las de
; menor prioridad (messenger:consume procesa los transportes en el
; orden indicado). La cola `low` tiene siempre un worker dedicado,
; por lo que ninguna cola queda sin consumidor garantizado.
;--------------------------------------------------------------------

[program:hydra-worker-high]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/example.com/hydra/bin/console messenger:consume async_high async async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/example.com/hydra
user=hydra
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/hydra/messenger-high.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[program:hydra-worker-medium]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/example.com/hydra/bin/console messenger:consume async async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/example.com/hydra
user=hydra
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/hydra/messenger-medium.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[program:hydra-worker-low]
command=/opt/plesk/php/8.4/bin/php -d memory_limit=256M /var/www/vhosts/example.com/hydra/bin/console messenger:consume async_low --time-limit=3600 --memory-limit=192M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/example.com/hydra
user=hydra
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/hydra/messenger-low.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[group:hydra]
programs=hydra-worker-high,hydra-worker-medium,hydra-worker-low
priority=999
