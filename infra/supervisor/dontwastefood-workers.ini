;--------------------------------------------------------------------
; Symfony Messenger workers para el proyecto Dont Waste Food
;
; Este fichero se versiona en el repositorio. En el servidor de
; producción se enlaza mediante un symlink desde /etc/supervisord.d/
;--------------------------------------------------------------------
[program:dontwastefood-workers]
command=/opt/plesk/php/8.4/bin/php /var/www/vhosts/bioscore.info/dontwastefood.bioscore.info/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --limit=200 -vv --env=prod --no-interaction
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vhosts/bioscore.info/dontwastefood.bioscore.info
user=bioscore.info_vtdmx4srwt
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dontwastefood/messenger.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="prod",APP_DEBUG="0"

[group:dontwastefood]
programs=dontwastefood-workers
priority=999
