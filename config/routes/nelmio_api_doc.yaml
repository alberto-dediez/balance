app.redocly:
    path: /openapi/documentation
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.redocly
        area: default

app.redocly.mobile:
    path: /openapi/mobile/documentation
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.redocly
        area: mobile

app.redocly.admin:
    path: /openapi/admin/documentation
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.redocly
        area: admin
