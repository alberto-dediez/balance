shared-api:
    resource:
        path: ../src/Shared/Infrastructure/UI/Api/
        namespace: App\Shared\Infrastructure\UI\Api
    type: attribute
    prefix: '/api'

shared-web:
    resource:
        path: ../src/Shared/Infrastructure/UI/Web/
        namespace: App\Shared\Infrastructure\UI\Web
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: '%app.locale_list%'
    defaults:
        _locale: '%app.locale_default%'

security-web:
    resource:
        path: ../src/Security/Infrastructure/UI/Web/
        namespace: App\Security\Infrastructure\UI\Web
        exclude: '../src/Security/Infrastructure/UI/Web/Public/'
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: '%app.locale_list%'
    defaults:
        _locale: '%app.locale_default%'

security-public-sign:
    resource:
        path: ../src/Security/Infrastructure/UI/Web/Public/
        namespace: App\Security\Infrastructure\UI\Web\Public
    type: attribute

security-api:
    resource:
        path: ../src/Security/Infrastructure/UI/Api/
        namespace: App\Security\Infrastructure\UI\Api
    type: attribute
    prefix: '/api'

