nelmio_api_doc:
    documentation:
        info:
            title: Hydra app
            description: This is an awesome app!
            version: 1.0.0
        tags:
            - name: 'Health Check'
              description: 'Endpoints related to verifying the status and availability of the service.'
            - name: 'Security'
              description: 'Endpoints related to security, login and session.'
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
