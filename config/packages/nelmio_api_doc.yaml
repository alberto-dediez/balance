nelmio_api_doc:
    documentation:
        info:
            title: Hydra app
            description: This is an awesome app!
            version: 1.0.0
        tags:
            - name: 'Health Check'
              description: 'Endpoints related to verifying the status and availability of the service.'
            - name: 'Security'
              description: 'Endpoints related to security, login and session.'
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT

        paths:
            /api/login:
                post:
                    tags:
                        - Security
                    summary: 'Login into API'
                    requestBody:
                        description: 'User credentials'
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        username:
                                            type: string
                                            example: 'user@example.com'
                                        password:
                                            type: string
                                            example: 'your_password'
                    responses:
                        '200':
                            description: 'Authentication successfull. Return a token.'
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token:
                                                type: string
                                                description: 'The JWT token'
                        '401':
                            description: 'Invalid credentials.'
                            
    areas: # to filter documented areas
        default:
            path_patterns:
                - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
            with_attribute: true
        admin:
            path_patterns:
                - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
            with_attribute: true
