doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            locale: App\Shared\Infrastructure\Persistence\Doctrine\Type\LocaleType  
            importation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationIdType
            exportation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ExportationIdType
            user_id: App\Security\Infrastructure\Persistence\Doctrine\Type\UserIdType
            account_id: App\Security\Infrastructure\Persistence\Doctrine\Type\AccountIdType
            recorded_event_id: App\Security\Infrastructure\Persistence\Doctrine\Type\RecordedEventIdType
            country_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CountryIdType
            destination_id: App\Property\Infrastructure\Persistence\Doctrine\Type\DestinationIdType
            property_id: App\Property\Infrastructure\Persistence\Doctrine\Type\PropertyIdType
            category_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CategoryIdType
            brand_id: App\Property\Infrastructure\Persistence\Doctrine\Type\BrandIdType
            company_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CompanyIdType
            signature_request_id: App\Security\Infrastructure\Persistence\Doctrine\Type\SignatureRequestIdType
            notification_id: App\Notifications\Infrastructure\Persistence\Doctrine\Type\NotificationIdType
            job_progress_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\JobProgressIdType
            job_progress_key: App\Shared\Infrastructure\Persistence\Doctrine\Type\JobProgressKeyType
            employee_id: App\HumanResources\Infrastructure\Persistence\Doctrine\Type\EmployeeIdType
            material_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MaterialIdType
            material_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MaterialEmissionFactorIdType
            merchandising_item_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MerchandisingItemIdType
            merchandising_item_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MerchandisingItemEmissionFactorIdType

    orm:
        auto_generate_proxy_classes: true
        enable_native_lazy_objects: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Security:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Security\Domain\Model'
                alias: Security

            Property:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Property/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Property\Domain\Model'
                alias: Property
                
            DataExchange:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/DataExchange/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\DataExchange\Domain\Model'
                alias: DataExchange
                
            Notifications:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notifications/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Notifications\Domain\Model'
                alias: Notifications

            HumanResources:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/HumanResources/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\HumanResources\Domain\Model'
                alias: HumanResources

            CarbonFootprint:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/CarbonFootprint/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\CarbonFootprint\Domain\Model'
                alias: CarbonFootprint

            Shared:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Shared\Domain\Model'
                alias: Shared

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            enable_lazy_ghost_objects: true
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
