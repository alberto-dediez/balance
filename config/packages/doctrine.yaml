doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            locale: App\Shared\Infrastructure\Persistence\Doctrine\Type\LocaleType
            importation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationIdType
            user_id: App\Security\Infrastructure\Persistence\Doctrine\Type\UserIdType
            account_id: App\Security\Infrastructure\Persistence\Doctrine\Type\AccountIdType
            recorded_event_id: App\Security\Infrastructure\Persistence\Doctrine\Type\RecordedEventIdType
            country_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CountryIdType
            destination_id: App\Property\Infrastructure\Persistence\Doctrine\Type\DestinationIdType
            property_id: App\Property\Infrastructure\Persistence\Doctrine\Type\PropertyIdType
            category_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CategoryIdType
            brand_id: App\Property\Infrastructure\Persistence\Doctrine\Type\BrandIdType
            container_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\ContainerIdType
            measurement_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\MeasurementIdType
            waste_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\WasteIdType
            waste_manager_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\WasteManagerIdType
            daily_waste_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\DailyWasteIdType
            alert_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\AlertIdType
            alert_configuration_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\AlertConfigurationIdType
            alert_configuration_item_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\AlertConfigurationItemIdType
            alert_check_queue_id: App\Waste\Infrastructure\Persistence\Doctrine\Type\AlertCheckQueueIdType
            signature_request_id: App\Security\Infrastructure\Persistence\Doctrine\Type\SignatureRequestIdType

    orm:
        auto_generate_proxy_classes: true
        enable_native_lazy_objects: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Security:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Security\Domain\Model'
                alias: Security

            Waste:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Waste/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Waste\Domain\Model'
                alias: Waste

            Property:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Property/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Property\Domain\Model'
                alias: Property
                
            DataExchange:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/DataExchange/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\DataExchange\Domain\Model'
                alias: DataExchange

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            enable_lazy_ghost_objects: true
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
