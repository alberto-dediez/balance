doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            locale: App\Shared\Infrastructure\Persistence\Doctrine\Type\LocaleType  
            importation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationIdType
            importation_profile_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationProfileIdType
            exportation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ExportationIdType
            user_id: App\Security\Infrastructure\Persistence\Doctrine\Type\UserIdType
            account_id: App\Security\Infrastructure\Persistence\Doctrine\Type\AccountIdType
            recorded_event_id: App\Security\Infrastructure\Persistence\Doctrine\Type\RecordedEventIdType
            country_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CountryIdType
            destination_id: App\Property\Infrastructure\Persistence\Doctrine\Type\DestinationIdType
            property_id: App\Property\Infrastructure\Persistence\Doctrine\Type\PropertyIdType
            category_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CategoryIdType
            brand_id: App\Property\Infrastructure\Persistence\Doctrine\Type\BrandIdType
            company_id: App\Property\Infrastructure\Persistence\Doctrine\Type\CompanyIdType
            provider_id: App\EventOperations\Infrastructure\Persistence\Doctrine\Type\ProviderIdType
            event_id: App\EventOperations\Infrastructure\Persistence\Doctrine\Type\EventIdType
            signature_request_id: App\Security\Infrastructure\Persistence\Doctrine\Type\SignatureRequestIdType
            notification_id: App\Notifications\Infrastructure\Persistence\Doctrine\Type\NotificationIdType
            media_id: App\Library\Infrastructure\Persistence\Doctrine\Type\MediaIdType
            job_progress_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\JobProgressIdType
            job_progress_key: App\Shared\Infrastructure\Persistence\Doctrine\Type\JobProgressKeyType
            employee_id: App\HumanResources\Infrastructure\Persistence\Doctrine\Type\EmployeeIdType
            material_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MaterialIdType
            material_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MaterialEmissionFactorIdType
            merchandising_item_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MerchandisingItemIdType
            merchandising_item_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MerchandisingItemEmissionFactorIdType
            catering_item_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\CateringItemIdType
            catering_item_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\CateringItemEmissionFactorIdType
            combustible_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\CombustibleIdType
            combustible_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\CombustibleEmissionFactorIdType
            emission_factor_group_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EmissionFactorGroupIdType
            road_transport_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\RoadTransportIdType
            road_transport_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\RoadTransportEmissionFactorIdType
            electricity_marketer_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\ElectricityMarketerIdType
            electricity_marketer_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\ElectricityMarketerEmissionFactorIdType
            gdo_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\GdOFactorIdType
            gdo_factor_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\GdOFactorEmissionFactorIdType
            machinery_fuel_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MachineryFuelIdType
            machinery_fuel_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MachineryFuelEmissionFactorIdType
            mobility_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MobilityIdType
            mobility_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\MobilityEmissionFactorIdType
            waste_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\WasteIdType
            waste_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\WasteEmissionFactorIdType
            overnight_stay_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\OvernightStayIdType
            overnight_stay_emission_factor_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\OvernightStayEmissionFactorIdType
            event_carbon_footprint_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EventCarbonFootprintIdType
            activity_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\ActivityIdType
            event_carbon_footprint_activity_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EventCarbonFootprintActivityIdType
            event_carbon_footprint_exclusion_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EventCarbonFootprintExclusionIdType
            provider_contribution_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\ProviderContributionIdType
            attendee_survey_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\AttendeeSurveyIdType
            attendee_survey_response_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\AttendeeSurveyResponseIdType
            attendee_survey_response_leg_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\AttendeeSurveyResponseLegIdType
            trip_calculation_link_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\TripCalculationLinkIdType
            trip_calculation_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\TripCalculationIdType
            trip_calculation_leg_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\TripCalculationLegIdType
            employee_participation_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EmployeeParticipationIdType
            employee_contribution_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EmployeeContributionIdType
            event_carbon_footprint_report_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\EventCarbonFootprintReportIdType
            public_landing_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\PublicLandingIdType
            public_landing_block_id: App\CarbonFootprint\Infrastructure\Persistence\Doctrine\Type\PublicLandingBlockIdType
            project_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\ProjectIdType
            account_project_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\AccountProjectIdType
            credit_purchase_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\CreditPurchaseIdType
            project_contribution_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\ProjectContributionIdType
            project_contribution_credit_allocation_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\ProjectContributionCreditAllocationIdType
            contribution_certificate_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\ContributionCertificateIdType
            ledger_entry_id: App\Balance\Infrastructure\Persistence\Doctrine\Type\LedgerEntryIdType
            payee_id: App\Payments\Infrastructure\Persistence\Doctrine\Type\PayeeIdType
            payment_id: App\Payments\Infrastructure\Persistence\Doctrine\Type\PaymentIdType
            payout_id: App\Payments\Infrastructure\Persistence\Doctrine\Type\PayoutIdType

    orm:
        auto_generate_proxy_classes: true
        enable_native_lazy_objects: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Security:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Security\Domain\Model'
                alias: Security

            Property:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Property/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Property\Domain\Model'
                alias: Property
                
            DataExchange:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/DataExchange/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\DataExchange\Domain\Model'
                alias: DataExchange
                
            Notifications:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notifications/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Notifications\Domain\Model'
                alias: Notifications
                
            Library:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Library/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Library\Domain\Model'
                alias: Library

            HumanResources:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/HumanResources/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\HumanResources\Domain\Model'
                alias: HumanResources

            CarbonFootprint:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/CarbonFootprint/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\CarbonFootprint\Domain\Model'
                alias: CarbonFootprint

            EventOperations:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/EventOperations/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\EventOperations\Domain\Model'
                alias: EventOperations

            Balance:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Balance/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Balance\Domain\Model'
                alias: Balance

            Payments:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payments/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Payments\Domain\Model'
                alias: Payments

            Shared:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Shared\Domain\Model'
                alias: Shared

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            enable_lazy_ghost_objects: true
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
