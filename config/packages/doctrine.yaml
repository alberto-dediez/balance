doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            locale: App\Shared\Infrastructure\Persistence\Doctrine\Type\LocaleType  
            importation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationIdType
            importation_profile_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ImportationProfileIdType
            exportation_id: App\DataExchange\Infrastructure\Persistence\Doctrine\Type\ExportationIdType
            user_id: App\Security\Infrastructure\Persistence\Doctrine\Type\UserIdType
            account_id: App\Security\Infrastructure\Persistence\Doctrine\Type\AccountIdType
            recorded_event_id: App\Security\Infrastructure\Persistence\Doctrine\Type\RecordedEventIdType
            signature_request_id: App\Security\Infrastructure\Persistence\Doctrine\Type\SignatureRequestIdType
            email_log_id: App\Security\Infrastructure\Persistence\Doctrine\Type\EmailLogIdType
            two_factor_method: App\Security\Infrastructure\Persistence\Doctrine\Type\TwoFactorMethodType
            notification_id: App\Notifications\Infrastructure\Persistence\Doctrine\Type\NotificationIdType
            media_id: App\Library\Infrastructure\Persistence\Doctrine\Type\MediaIdType
            announcement_id: App\Changelog\Infrastructure\Persistence\Doctrine\Type\AnnouncementIdType
            youtube_video: App\Changelog\Infrastructure\Persistence\Doctrine\Type\YouTubeVideoType

    orm:
        auto_generate_proxy_classes: true
        enable_native_lazy_objects: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Shared:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Shared\Domain\Model'
                alias: Shared
            Security:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Security\Domain\Model'
                alias: Security
            DataExchange:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/DataExchange/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\DataExchange\Domain\Model'
                alias: DataExchange
            Notifications:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notifications/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Notifications\Domain\Model'
                alias: Notifications
            Library:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Library/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Library\Domain\Model'
                alias: Library
            Changelog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Changelog/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Changelog\Domain\Model'
                alias: Changelog
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            enable_lazy_ghost_objects: true
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
