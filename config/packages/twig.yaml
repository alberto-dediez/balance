twig:
    file_name_pattern: '*.twig'
    globals:
        locale_list: '%app.locale_list%'
        company_name: '%company.name%'
    form_themes: 
        - 'bootstrap_5_layout.html.twig'
        - '@shared/form/custom_types.html.twig'
    paths:
        'templates/components': 'components' 
        'templates/shared': 'shared'
        'templates/security': 'security'
        'templates/property': 'property'
        'templates/data_exchange': 'data_exchange'
        'templates/human_resources': 'human_resources'
        'templates/notifications': 'notifications'
        'templates/carbon_footprint': 'carbon_footprint'
        'templates/event_operations': 'event_operations'
        'templates/library': 'library'
        'templates/balance': 'balance'
        'templates/payments': 'payments'
        'templates/themes': 'themes'
        '%kernel.project_dir%/assets': assets

when@test:
    twig:
        strict_variables: true
