security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Security\Infrastructure\Symfony\Security\UserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false        

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
        api_login: 
            pattern: ^/api/login
            provider: app_user_provider
            user_checker: App\Security\Infrastructure\Symfony\Security\UserChecker
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 3    

        api:
            pattern:   ^/api
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\Infrastructure\Symfony\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route
                
            login_throttling:
                max_attempts: 3    

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: /health-check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/openapi/documentation, roles: ROLE_ADMIN }
        - { path: ^/openapi/mobile/documentation, roles: ROLE_ADMIN }
        - { path: ^/openapi/admin/documentation, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: /recover-password, roles: PUBLIC_ACCESS }
        - { path: /login, roles: PUBLIC_ACCESS }
        - { path: /logout, role: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
        

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext
