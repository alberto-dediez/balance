# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - remove
            - unpublish
            - two-factor
            - two-factor-cancel
            - two-factor-disable
            - two-factor-email
            - two-factor-totp
            - two-factor-reset
