framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
            - templates/components/
        excluded_patterns:
            - '*/assets/styles/_*.scss'
            - '*/assets/styles/**/_*.scss'
            - '*/assets/styles/email.scss'
            - '*/assets/fonts/font-awesome/scss/*'
        missing_import_mode: warn

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
