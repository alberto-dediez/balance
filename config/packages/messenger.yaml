framework:
    messenger:
        failure_transport: failed

        transports:
            async_high: '%env(MESSENGER_TRANSPORT_DSN)%'
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            async_low: '%env(MESSENGER_TRANSPORT_DSN)%'
            alerts:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: alerts
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

when@test:
    framework:
        messenger:
            transports:
                async_high: 'in-memory://'
                async: 'in-memory://'
                async_low: 'in-memory://'
