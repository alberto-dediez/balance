framework:
    messenger:
        failure_transport: failed

        transports:
            async_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: high
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: medium
            async_low:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: low
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

when@test:
    framework:
        messenger:
            transports:
                async_high: 'in-memory://'
                async: 'in-memory://'
                async_low: 'in-memory://'
