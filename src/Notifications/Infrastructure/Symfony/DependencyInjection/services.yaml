parameters:
    app.internal_notifications_enabled: '%env(bool:INTERNAL_NOTIFICATIONS_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Notifications\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

    App\Notifications\Application\Notification\Notify\SystemNotifier: '@App\Notifications\Infrastructure\Notification\DispatchingSystemNotifier'

    App\Notifications\Infrastructure\Notification\DispatchingSystemNotifier:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'

    App\Notifications\Infrastructure\UI\Web\Component\Topbar\Notifications:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'

    App\Notifications\Infrastructure\UI\Web\User\Notification\ListController:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'

    App\Notifications\Infrastructure\UI\Web\User\Notification\ShowController:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'

    App\Notifications\Infrastructure\UI\Web\User\Notification\MarkAllReadController:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'

    App\Shared\Infrastructure\UI\Web\Navigation\NodeLister:
        arguments:
            $internalNotificationsEnabled: '%app.internal_notifications_enabled%'
