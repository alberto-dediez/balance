parameters:
    app.uploads_dir: '%kernel.project_dir%/var/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $uploadsDir: '%app.uploads_dir%'
            $localeList: '%app.locale_list%'

    App\FoodLoss\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

    App\FoodLoss\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\FoodLoss\Application\DonationAgreement\DonationAgreementUploader:
        alias: App\FoodLoss\Infrastructure\FileUploader\LocalFileDonationAgreementUploader

    App\FoodLoss\Application\Protocol\ProtocolUploader:
        alias: App\FoodLoss\Infrastructure\FileUploader\LocalFileProtocolUploader

    App\FoodLoss\Application\DoggyBagSign\DoggyBagSignUploader:
        alias: App\FoodLoss\Infrastructure\FileUploader\LocalFileDoggyBagSignUploader

    App\FoodLoss\Domain\Model\PreventionPlan\ProposedActionsLoader:
        alias: App\FoodLoss\Infrastructure\AI\GeminiProposedActionsLoader

    App\FoodLoss\Domain\Model\PreventionPlan\SectionsGenerator:
        alias: App\FoodLoss\Infrastructure\AI\GeminiSectionsGenerator

    App\FoodLoss\Domain\Model\PreventionPlan\PreventionPlanPdfGenerator:
        alias: App\FoodLoss\Infrastructure\Tcpdf\TcpdfPreventionPlanPdfGenerator

    App\FoodLoss\Application\PreventionPlan\PreventionPlanPdfUploader:
        alias: App\FoodLoss\Infrastructure\FileUploader\LocalFilePreventionPlanPdfUploader

    App\FoodLoss\Application\PreventionPlan\PreventionPlanDraftTranslator:
        alias: App\FoodLoss\Infrastructure\AI\GeminiPreventionPlanDraftTranslator
