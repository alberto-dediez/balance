parameters:
    app.trip_max_legs: 16
    app.ecb_exchange_rates_url: '%env(ECB_EXCHANGE_RATES_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            App\CarbonFootprint\Infrastructure\UI\Web\Public\PublicFormRateLimiter $attendeeSurveyRateLimiter: '@carbon_footprint.attendee_survey_rate_limiter'
            App\CarbonFootprint\Infrastructure\UI\Web\Public\PublicFormRateLimiter $propertyTripRateLimiter: '@carbon_footprint.property_trip_rate_limiter'
            Symfony\Component\RateLimiter\RateLimiterFactory $certificateResendLimiter: '@limiter.certificate_resend'
            string $consentPolicyVersion: '%app.consent_policy_version%'

    App\CarbonFootprint\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'
            - '../../../Infrastructure/UI/Web/Public/PublicFormRateLimiter.php'

    carbon_footprint.attendee_survey_rate_limiter:
        class: App\CarbonFootprint\Infrastructure\UI\Web\Public\PublicFormRateLimiter
        arguments:
            $tokenLimiter: '@limiter.attendee_survey_token'
            $invalidTokenLimiter: '@limiter.attendee_survey_invalid_token'
            $placesLimiter: '@limiter.attendee_survey_places'

    carbon_footprint.property_trip_rate_limiter:
        class: App\CarbonFootprint\Infrastructure\UI\Web\Public\PublicFormRateLimiter
        arguments:
            $tokenLimiter: '@limiter.property_trip_token'
            $invalidTokenLimiter: '@limiter.property_trip_invalid_token'
            $placesLimiter: '@limiter.property_trip_places'

    App\CarbonFootprint\Application\CarbonFootprintReport\Register\RegisterCarbonFootprintReportService:
        arguments:
            $localeList: '%app.locale_list%'

    App\CarbonFootprint\Application\CarbonFootprintReport\GeneratePdf\GenerateCarbonFootprintReportPdfService:
        arguments:
            $localeList: '%app.locale_list%'

    App\CarbonFootprint\Application\CarbonFootprintReport\GenerateTexts\GenerateCarbonFootprintReportTextsService:
        arguments:
            $localeList: '%app.locale_list%'

    App\CarbonFootprint\Infrastructure\Storage\LocalCarbonFootprintReportStorage:
        arguments:
            $basePath: '%app.uploads_dir%/carbon-footprint-reports'

    App\CarbonFootprint\Domain\Model\CarbonFootprintReport\CarbonFootprintReportStorage: '@App\CarbonFootprint\Infrastructure\Storage\LocalCarbonFootprintReportStorage'

    App\CarbonFootprint\Infrastructure\Tcpdf\ThemeAwareCarbonFootprintReportPdfGenerator:
        arguments:
            $themeGenerators: !tagged_locator { tag: 'app.theme.report_generator', index_by: 'theme' }

    App\CarbonFootprint\Infrastructure\Tcpdf\ClassicTcpdfCarbonFootprintReportPdfGenerator:
        tags:
            - { name: 'app.theme.report_generator', theme: 'classic' }

    App\CarbonFootprint\Domain\Model\CarbonFootprintReport\CarbonFootprintReportPdfGenerator: '@App\CarbonFootprint\Infrastructure\Tcpdf\TcpdfCarbonFootprintReportPdfGenerator'

    App\CarbonFootprint\Domain\Model\Trip\TripLegsResolver:
        arguments:
            $maxLegs: '%app.trip_max_legs%'

    App\CarbonFootprint\Application\AttendeeSurvey\GetByToken\GetAttendeeSurveyByTokenService:
        arguments:
            $maxLegs: '%app.trip_max_legs%'

    App\CarbonFootprint\Application\TripCalculationLink\GetByToken\GetTripCalculationLinkByTokenService:
        arguments:
            $maxLegs: '%app.trip_max_legs%'

    App\CarbonFootprint\Infrastructure\Geo\Google\GoogleRoutesApiDistanceCalculator:
        arguments:
            $apiKey: '%app.google_maps_api_key%'
            $enabled: '%app.google_maps_enabled%'
            $region: '%app.google_maps_region%'

    App\CarbonFootprint\Infrastructure\Geo\CachedRouteDistanceCalculator:
        arguments:
            $calculator: '@App\CarbonFootprint\Infrastructure\Geo\Google\GoogleRoutesApiDistanceCalculator'
            $cache: '@cache.app'

    App\CarbonFootprint\Domain\Model\Geo\RouteDistanceCalculator: '@App\CarbonFootprint\Infrastructure\Geo\CachedRouteDistanceCalculator'

when@test:
    services:
        App\CarbonFootprint\Domain\Model\Geo\RouteDistanceCalculator: '@App\CarbonFootprint\Domain\Model\Geo\GreatCircleRouteDistanceCalculator'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\CarbonFootprint\Infrastructure\Gateway\EcbHttpExchangeRateGateway:
            arguments:
                $url: '%app.ecb_exchange_rates_url%'

when@prod:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\CarbonFootprint\Infrastructure\Gateway\EcbHttpExchangeRateGateway:
            arguments:
                $url: '%app.ecb_exchange_rates_url%'
