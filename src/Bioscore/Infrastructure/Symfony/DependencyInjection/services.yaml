services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Bioscore\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Bioscore\Infrastructure\Gateway\BioscoreApiAuthenticator:
            arguments:
                $apiBaseUrl: '%sso_api_url%'
                $username: '%env(BIOSCORE_API_USERNAME)%'
                $password: '%env(BIOSCORE_API_PASSWORD)%'

        App\Bioscore\Infrastructure\Gateway\HttpBioscoreCatalogGateway:
            arguments:
                $apiBaseUrl: '%sso_api_url%'

        App\Bioscore\Infrastructure\Gateway\HttpBioscoreConsumptionGateway:
            arguments:
                $apiBaseUrl: '%sso_api_url%'

when@prod:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Bioscore\Infrastructure\Gateway\BioscoreApiAuthenticator:
            arguments:
                $apiBaseUrl: '%sso_api_url%'
                $username: '%env(BIOSCORE_API_USERNAME)%'
                $password: '%env(BIOSCORE_API_PASSWORD)%'

        App\Bioscore\Infrastructure\Gateway\HttpBioscoreCatalogGateway:
            arguments:
                $apiBaseUrl: '%sso_api_url%'

        App\Bioscore\Infrastructure\Gateway\HttpBioscoreConsumptionGateway:
            arguments:
                $apiBaseUrl: '%sso_api_url%'
