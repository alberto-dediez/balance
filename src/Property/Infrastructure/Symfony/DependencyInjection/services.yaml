parameters:
    app.properties_enabled: '%env(bool:PROPERTIES_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Property\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

    App\Property\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']
