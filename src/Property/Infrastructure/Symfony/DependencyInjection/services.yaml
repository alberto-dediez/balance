parameters:
    app.properties_enabled: '%env(bool:PROPERTIES_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Property\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

    App\Property\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Property\Domain\Event\DistributorAssignment\RemoveAssignmentsOnAccountRemovedSubscriber:
        tags: [{ name: domain.event.subscriber, priority: 10 }]
