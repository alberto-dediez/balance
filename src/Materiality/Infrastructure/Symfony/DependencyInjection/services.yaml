    App\CarbonFootprint\Domain\Model\CarbonFootprintReport\MaterialityAssessmentSnapshotProvider:
        alias: App\Materiality\Application\MaterialityAssessment\Snapshot\MaterialityAssessmentSnapshotAdapter
