parameters:
    app.locale_default: '%env(LANGUAGE_DEFAULT)%'
    app.locale_list: '%env(LANGUAGE_LIST)%'
    company.name: '%env(COMPANY_NAME)%'
    mailer.from: '%env(MAILER_FROM)%'
    app.gemini_api_key: '%env(GEMINI_API_KEY)%'
    app.gemini_model_low: '%env(GEMINI_MODEL_LOW)%'
    app.gemini_model_medium: '%env(GEMINI_MODEL_MEDIUM)%'
    app.gemini_model_high: '%env(GEMINI_MODEL_HIGH)%'
    app.gemini_log_enabled: '%env(bool:GEMINI_LOG_ENABLED)%'
    app.uploads_dir: '%kernel.project_dir%/var/uploads'
    app.chart_endpoint: '%env(CHART_ENDPOINT)%'
    app.google_maps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'
    app.google_maps_enabled: '%env(bool:GOOGLE_MAPS_ENABLED)%'
    app.google_maps_region: '%env(GOOGLE_MAPS_REGION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\:
        resource: '../../../'

    App\Fixtures\:
        resource: '../../../../../fixtures/'
        tags: ['doctrine.fixture.orm']

    App\Shared\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Shared\Infrastructure\Symfony\Form\Type\LocaleType:
        arguments:
            $localeList: '%app.locale_list%'

    App\Shared\Infrastructure\Locale\RequestStackLocaleSetter:
        arguments:
            $defaultLocale: '%app.locale_default%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    App\Shared\Infrastructure\Email\SymfonyEmailSender:
        public: true
        arguments:
            $mailerFrom: '%mailer.from%'

    App\Shared\Infrastructure\Symfony\Event\EmailListener:
        public: true
        shared: true

    App\Shared\Domain\Model\Sms\SmsSender: '@App\Shared\Infrastructure\Sms\TwilioSmsSender'

    App\Shared\Domain\Model\WhatsApp\WhatsAppSender: '@App\Shared\Infrastructure\WhatsApp\TwilioWhatsAppSender'

    App\Shared\Infrastructure\AI\Gemini\GeminiHttpClient:
        arguments:
            $apiKey: '%app.gemini_api_key%'
            $modelLow: '%app.gemini_model_low%'
            $modelMedium: '%app.gemini_model_medium%'
            $modelHigh: '%app.gemini_model_high%'
            $logEnabled: '%app.gemini_log_enabled%'
            $logDir: '%kernel.project_dir%/var/gemini-logs'

    App\Shared\Infrastructure\AI\Gemini\GeminiClient:
        alias: App\Shared\Infrastructure\AI\Gemini\GeminiHttpClient

    App\Shared\Infrastructure\Chart\ApexChartHttpClient:
        arguments:
            $endpoint: '%app.chart_endpoint%'

    App\Shared\Infrastructure\Chart\ApexChartClient:
        alias: App\Shared\Infrastructure\Chart\ApexChartHttpClient

    App\Shared\Infrastructure\Geo\Google\GooglePlacesApiPlaceFinder:
        arguments:
            $apiKey: '%app.google_maps_api_key%'
            $enabled: '%app.google_maps_enabled%'
            $region: '%app.google_maps_region%'

    App\Shared\Infrastructure\Geo\CachedPlaceFinder:
        arguments:
            $placeFinder: '@App\Shared\Infrastructure\Geo\Google\GooglePlacesApiPlaceFinder'
            $cache: '@cache.app'

    App\Shared\Domain\Model\Geo\PlaceFinder: '@App\Shared\Infrastructure\Geo\CachedPlaceFinder'

when@test:
    services:
        App\Shared\Domain\Model\Geo\PlaceFinder: '@App\Shared\Infrastructure\Geo\NullPlaceFinder'
