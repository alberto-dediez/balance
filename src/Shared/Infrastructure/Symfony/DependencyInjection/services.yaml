parameters:
    app.locale_default: '%env(LANGUAGE_DEFAULT)%'
    app.locale_list: '%env(LANGUAGE_LIST)%'
    app.admin_prefix: '%env(ADMIN_PREFIX)%'
    company.name: '%env(COMPANY_NAME)%'
    mailer.from: '%env(MAILER_FROM)%'
    app.uploads_dir: '%kernel.project_dir%/var/uploads'
    app.maintenance_mode: '%env(bool:MAINTENANCE_MODE)%'
    error_report.enabled: '%env(bool:ERROR_NOTIFICATIONS_ENABLED)%'
    error_report.recipients: '%env(ERROR_NOTIFICATION_RECIPIENTS)%'
    error_report.throttle_minutes: '%env(int:ERROR_NOTIFICATIONS_THROTTLE_MINUTES)%'
    app.gemini_api_key: '%env(GEMINI_API_KEY)%'
    app.gemini_model_low: '%env(GEMINI_MODEL_LOW)%'
    app.gemini_model_medium: '%env(GEMINI_MODEL_MEDIUM)%'
    app.gemini_model_high: '%env(GEMINI_MODEL_HIGH)%'
    app.google_maps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'
    app.google_maps_enabled: '%env(bool:GOOGLE_MAPS_ENABLED)%'
    app.google_maps_region: '%env(GOOGLE_MAPS_REGION)%'
    error_report.erp.enabled: '%env(bool:ERROR_NOTIFICATIONS_ERP_ENABLED)%'
    error_report.erp.url: '%env(ERROR_NOTIFICATIONS_ERP_URL)%'
    error_report.erp.username: '%env(ERROR_NOTIFICATIONS_ERP_USERNAME)%'
    error_report.erp.api_token: '%env(ERROR_NOTIFICATIONS_ERP_API_TOKEN)%'
    error_report.erp.project_id: '%env(ERROR_NOTIFICATIONS_ERP_PROJECT_ID)%'
    error_report.erp.throttle_minutes: '%env(int:ERROR_NOTIFICATIONS_ERP_THROTTLE_MINUTES)%'
    ovh.s3.endpoint: '%env(OVH_S3_ENDPOINT)%'
    ovh.s3.region: '%env(OVH_S3_REGION)%'
    ovh.s3.bucket: '%env(OVH_S3_BUCKET)%'
    ovh.s3.access_key: '%env(OVH_S3_ACCESS_KEY)%'
    ovh.s3.secret_key: '%env(OVH_S3_SECRET_KEY)%'
    ovh.s3.prefix: '%env(OVH_S3_PREFIX)%'
    google_drive.credentials_file: '%env(GOOGLE_DRIVE_CREDENTIALS_FILE)%'
    google_drive.folder_id: '%env(GOOGLE_DRIVE_FOLDER_ID)%'
    shared.health_check.queue_max_wait_minutes: '%env(int:HEALTH_CHECK_QUEUE_MAX_WAIT_MINUTES)%'
    shared.health_check.queue_transports:
        async_high: high
        async: medium
        async_low: low
    shared.live_updates_enabled: '%env(bool:LIVE_UPDATES_ENABLED)%'
    shared.assistant.disabled_tools: []
    shared.assistant.suggestions: []
    shared.assistant.document_routes: []
    app.ai_provider: '%env(AI_PROVIDER)%'
    app.ai_log_enabled: '%env(bool:AI_LOG_ENABLED)%'
    app.anthropic_api_key: '%env(ANTHROPIC_API_KEY)%'
    app.anthropic_model_low: '%env(ANTHROPIC_MODEL_LOW)%'
    app.anthropic_model_medium: '%env(ANTHROPIC_MODEL_MEDIUM)%'
    app.anthropic_model_high: '%env(ANTHROPIC_MODEL_HIGH)%'
    shared.integration.enabled: '%env(bool:INTEGRATION_EVENTS_ENABLED)%'
    shared.integration.platform: '%env(INTEGRATION_PLATFORM)%'
    shared.integration.max_hops: '%env(int:INTEGRATION_MAX_HOPS)%'
    shared.integration.username: '%env(INTEGRATION_USERNAME)%'
    shared.integration.retention_days: '%env(int:INTEGRATION_RETENTION_DAYS)%'
    shared.integration.outbox_max_wait_minutes: '%env(int:INTEGRATION_OUTBOX_MAX_WAIT_MINUTES)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/Maintenance/'

    App\Fixtures\:
        resource: '../../../../../fixtures/'
        tags: ['doctrine.fixture.orm']

    App\Shared\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Shared\Infrastructure\Symfony\Form\Type\LocaleType:
        arguments:
            $localeList: '%app.locale_list%'

    App\Shared\Infrastructure\Locale\RequestStackLocaleSetter:
        arguments:
            $defaultLocale: '%app.locale_default%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    App\Shared\Infrastructure\Symfony\Twig\AdminPathExtension:
        arguments:
            $adminPrefix: '%app.admin_prefix%'

    App\Shared\Infrastructure\Email\SymfonyEmailSender:
        public: true
        arguments:
            $mailerFrom: '%mailer.from%'
            $mailerDsn: '%env(MAILER_DSN)%'

    App\Shared\Infrastructure\Email\SendgridTrackingSettingsHttpClient:
        arguments:
            $client: '@http_client'
            $clickTracking: '%env(bool:SENDGRID_CLICK_TRACKING)%'

    mailer.transport_factory.sendgrid:
        class: Symfony\Component\Mailer\Bridge\Sendgrid\Transport\SendgridTransportFactory
        autowire: false
        autoconfigure: false
        arguments:
            - '@event_dispatcher'
            - '@App\Shared\Infrastructure\Email\SendgridTrackingSettingsHttpClient'
            - '@?logger'
        tags:
            - { name: mailer.transport_factory }
            - { name: monolog.logger, channel: mailer }

    App\Shared\Infrastructure\Symfony\Event\EmailListener:
        public: true
        shared: true

    App\Shared\Infrastructure\ErrorReport\ErrorReportFactory:
        arguments:
            $environment: '%kernel.environment%'

    App\Shared\Infrastructure\ErrorReport\CacheErrorReportThrottle:
        arguments:
            $cache: '@cache.app'
            $throttleMinutes: '%error_report.throttle_minutes%'

    App\Shared\Infrastructure\ErrorReport\EmailErrorReportNotifier:
        arguments:
            $enabled: '%error_report.enabled%'
            $recipients: '%error_report.recipients%'
        tags:
            - { name: monolog.logger, channel: error_report }

    error_report.erp_throttle:
        class: App\Shared\Infrastructure\ErrorReport\CacheErrorReportThrottle
        arguments:
            $cache: '@cache.app'
            $throttleMinutes: '%error_report.erp.throttle_minutes%'
            $keyPrefix: 'error_report_erp'

    App\Shared\Infrastructure\ErrorReport\Erp\ErpErrorReportClient:
        arguments:
            $httpClient: '@http_client'
            $cache: '@cache.app'
            $url: '%error_report.erp.url%'
            $username: '%error_report.erp.username%'
            $apiToken: '%error_report.erp.api_token%'

    App\Shared\Infrastructure\ErrorReport\Erp\ErpErrorReportNotifier:
        arguments:
            $throttle: '@error_report.erp_throttle'
            $enabled: '%error_report.erp.enabled%'
            $projectId: '%error_report.erp.project_id%'
        tags:
            - { name: monolog.logger, channel: error_report }

    App\Shared\Infrastructure\ErrorReport\ChainErrorReportNotifier:
        arguments:
            $notifiers:
                - '@App\Shared\Infrastructure\ErrorReport\EmailErrorReportNotifier'
                - '@App\Shared\Infrastructure\ErrorReport\Erp\ErpErrorReportNotifier'
        tags:
            - { name: monolog.logger, channel: error_report }

    App\Shared\Domain\Model\ErrorReport\ErrorReportNotifier: '@App\Shared\Infrastructure\ErrorReport\ChainErrorReportNotifier'

    App\Shared\Domain\Model\ErrorReport\ErrorReportThrottle: '@App\Shared\Infrastructure\ErrorReport\CacheErrorReportThrottle'

    App\Shared\Infrastructure\Symfony\Event\MaintenanceModeListener:
        arguments:
            $maintenanceMode: '%app.maintenance_mode%'

    App\Shared\Domain\Model\Sms\SmsSender: '@App\Shared\Infrastructure\Sms\TwilioSmsSender'

    App\Shared\Domain\Model\WhatsApp\WhatsAppSender: '@App\Shared\Infrastructure\WhatsApp\TwilioWhatsAppSender'

    App\Shared\Infrastructure\Geo\Google\GooglePlacesApiPlaceFinder:
        arguments:
            $apiKey: '%app.google_maps_api_key%'
            $enabled: '%app.google_maps_enabled%'
            $region: '%app.google_maps_region%'

    App\Shared\Infrastructure\Geo\CachedPlaceFinder:
        arguments:
            $placeFinder: '@App\Shared\Infrastructure\Geo\Google\GooglePlacesApiPlaceFinder'
            $cache: '@cache.app'

    App\Shared\Domain\Model\Geo\PlaceFinder: '@App\Shared\Infrastructure\Geo\CachedPlaceFinder'

    App\Shared\Infrastructure\Storage\Ovh\OvhS3ClientFactory:
        arguments:
            $endpoint: '%ovh.s3.endpoint%'
            $region: '%ovh.s3.region%'
            $accessKey: '%ovh.s3.access_key%'
            $secretKey: '%ovh.s3.secret_key%'
            $httpClient: null

    AsyncAws\S3\S3Client:
        factory: ['@App\Shared\Infrastructure\Storage\Ovh\OvhS3ClientFactory', 'create']
        lazy: true

    App\Shared\Infrastructure\Storage\GoogleDrive\GoogleDriveAccessTokenProvider:
        arguments:
            $credentialsFile: '%google_drive.credentials_file%'

    App\Shared\Infrastructure\Persistence\Doctrine\DatabaseHealthIndicator:
        tags: [{ name: shared.health_indicator, priority: 20 }]

    App\Shared\Application\Persistence\UnitOfWorkReleaser: '@App\Shared\Infrastructure\Persistence\Doctrine\DoctrineUnitOfWorkReleaser'

    App\Shared\Infrastructure\Symfony\Messenger\QueueHealthIndicator:
        arguments:
            $transportNames: '%shared.health_check.queue_transports%'
            $maxWaitMinutes: '%shared.health_check.queue_max_wait_minutes%'
        tags: [{ name: shared.health_indicator, priority: 10 }]

    App\Shared\Infrastructure\Ai\AiRequestLog:
        arguments:
            $enabled: '%app.ai_log_enabled%'
            $dir: '%kernel.project_dir%/var/ai-logs'

    App\Shared\Infrastructure\Live\BufferedLiveUpdates:
        arguments:
            $enabled: '%shared.live_updates_enabled%'

    App\Shared\Application\Live\LiveUpdates: '@App\Shared\Infrastructure\Live\BufferedLiveUpdates'

    App\Shared\Application\Assistant\CurrentAssistantExecution: '@App\Shared\Infrastructure\Assistant\ResettableCurrentAssistantExecution'

    App\Shared\Infrastructure\Live\LiveSubscriptionCookieSubscriber:
        arguments:
            $enabled: '%shared.live_updates_enabled%'

    App\Shared\Infrastructure\Symfony\Twig\LiveExtension:
        arguments:
            $enabled: '%shared.live_updates_enabled%'

    App\Shared\Infrastructure\Integration\IntegrationSettings:
        arguments:
            $enabled: '%shared.integration.enabled%'
            $platform: '%shared.integration.platform%'
            $maxHops: '%shared.integration.max_hops%'

    App\Shared\Infrastructure\Integration\IntegrationUserProvider:
        arguments:
            $username: '%shared.integration.username%'

    App\Shared\Application\Integration\Purge\PurgeIntegrationMessagesService:
        arguments:
            $retentionDays: '%shared.integration.retention_days%'

    App\Shared\Infrastructure\Integration\IntegrationOutboxHealthIndicator:
        arguments:
            $maxWaitMinutes: '%shared.integration.outbox_max_wait_minutes%'
        tags: [{ name: shared.health_indicator, priority: 5 }]

    App\Shared\Application\Integration\IntegrationEventPublisher: '@App\Shared\Infrastructure\Integration\BufferedIntegrationEventPublisher'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Shared\Infrastructure\Ai\Gemini\GeminiAiClient:
            arguments:
                $apiKey: '%app.gemini_api_key%'
                $modelLow: '%app.gemini_model_low%'
                $modelMedium: '%app.gemini_model_medium%'
                $modelHigh: '%app.gemini_model_high%'

        App\Shared\Infrastructure\Ai\Anthropic\AnthropicAiClient:
            arguments:
                $apiKey: '%app.anthropic_api_key%'
                $modelLow: '%app.anthropic_model_low%'
                $modelMedium: '%app.anthropic_model_medium%'
                $modelHigh: '%app.anthropic_model_high%'

        App\Shared\Infrastructure\Ai\ProviderAiClient:
            arguments:
                $provider: '%app.ai_provider%'

        App\Shared\Application\Ai\AiClient:
            alias: App\Shared\Infrastructure\Ai\ProviderAiClient

        App\Shared\Infrastructure\Ai\Anthropic\AnthropicAiAgentClient:
            arguments:
                $apiKey: '%app.anthropic_api_key%'
                $modelLow: '%app.anthropic_model_low%'
                $modelMedium: '%app.anthropic_model_medium%'
                $modelHigh: '%app.anthropic_model_high%'

        App\Shared\Infrastructure\Ai\ProviderAiAgentClient:
            arguments:
                $provider: '%app.ai_provider%'

        App\Shared\Application\Ai\Agent\AiAgentClient:
            alias: App\Shared\Infrastructure\Ai\ProviderAiAgentClient

when@prod:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Shared\Infrastructure\Ai\Gemini\GeminiAiClient:
            arguments:
                $apiKey: '%app.gemini_api_key%'
                $modelLow: '%app.gemini_model_low%'
                $modelMedium: '%app.gemini_model_medium%'
                $modelHigh: '%app.gemini_model_high%'

        App\Shared\Infrastructure\Ai\Anthropic\AnthropicAiClient:
            arguments:
                $apiKey: '%app.anthropic_api_key%'
                $modelLow: '%app.anthropic_model_low%'
                $modelMedium: '%app.anthropic_model_medium%'
                $modelHigh: '%app.anthropic_model_high%'

        App\Shared\Infrastructure\Ai\ProviderAiClient:
            arguments:
                $provider: '%app.ai_provider%'

        App\Shared\Application\Ai\AiClient:
            alias: App\Shared\Infrastructure\Ai\ProviderAiClient

        App\Shared\Infrastructure\Ai\Anthropic\AnthropicAiAgentClient:
            arguments:
                $apiKey: '%app.anthropic_api_key%'
                $modelLow: '%app.anthropic_model_low%'
                $modelMedium: '%app.anthropic_model_medium%'
                $modelHigh: '%app.anthropic_model_high%'

        App\Shared\Infrastructure\Ai\ProviderAiAgentClient:
            arguments:
                $provider: '%app.ai_provider%'

        App\Shared\Application\Ai\Agent\AiAgentClient:
            alias: App\Shared\Infrastructure\Ai\ProviderAiAgentClient

when@test:
    parameters:
        app.uploads_dir: '%kernel.project_dir%/var/uploads_test%env(default::TEST_TOKEN)%'
        error_report.erp.enabled: false

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Shared\Infrastructure\Health\InMemoryHealthIndicator:
            public: true
            tags: [{ name: shared.health_indicator, priority: 0 }]

        App\Shared\Domain\Model\Geo\PlaceFinder: '@App\Shared\Infrastructure\Geo\NullPlaceFinder'

        App\Shared\Application\Persistence\UnitOfWorkReleaser: '@App\Shared\Infrastructure\Persistence\InMemory\NullUnitOfWorkReleaser'

        App\Shared\Infrastructure\Ai\InMemoryAiClient:
            public: true

        App\Shared\Application\Ai\AiClient:
            alias: App\Shared\Infrastructure\Ai\InMemoryAiClient
            public: true

        App\Shared\Infrastructure\Ai\InMemoryAiAgentClient:
            public: true

        App\Shared\Application\Ai\Agent\AiAgentClient:
            alias: App\Shared\Infrastructure\Ai\InMemoryAiAgentClient
            public: true
