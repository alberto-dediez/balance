parameters:
    app.locale_default: '%env(LANGUAGE_DEFAULT)%'
    app.locale_list: '%env(LANGUAGE_LIST)%'
    company.name: '%env(COMPANY_NAME)%'
    mailer.from: '%env(MAILER_FROM)%'
    app.uploads_dir: '%kernel.project_dir%/var/uploads'
    app.maintenance_mode: '%env(bool:MAINTENANCE_MODE)%'
    error_report.enabled: '%env(bool:ERROR_NOTIFICATIONS_ENABLED)%'
    error_report.recipients: '%env(ERROR_NOTIFICATION_RECIPIENTS)%'
    error_report.throttle_minutes: '%env(int:ERROR_NOTIFICATIONS_THROTTLE_MINUTES)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\:
        resource: '../../../'

    App\Fixtures\:
        resource: '../../../../../fixtures/'
        tags: ['doctrine.fixture.orm']

    App\Shared\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Shared\Infrastructure\Symfony\Form\Type\LocaleType:
        arguments:
            $localeList: '%app.locale_list%'

    App\Shared\Infrastructure\Locale\RequestStackLocaleSetter:
        arguments:
            $defaultLocale: '%app.locale_default%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    App\Shared\Infrastructure\Email\SymfonyEmailSender:
        public: true
        arguments:
            $mailerFrom: '%mailer.from%'

    App\Shared\Infrastructure\Symfony\Event\EmailListener:
        public: true
        shared: true

    App\Shared\Infrastructure\ErrorReport\ErrorReportFactory:
        arguments:
            $environment: '%kernel.environment%'

    App\Shared\Infrastructure\ErrorReport\CacheErrorReportThrottle:
        arguments:
            $cache: '@cache.app'
            $throttleMinutes: '%error_report.throttle_minutes%'

    App\Shared\Infrastructure\ErrorReport\EmailErrorReportNotifier:
        arguments:
            $enabled: '%error_report.enabled%'
            $recipients: '%error_report.recipients%'
        tags:
            - { name: monolog.logger, channel: error_report }

    App\Shared\Domain\Model\ErrorReport\ErrorReportNotifier: '@App\Shared\Infrastructure\ErrorReport\EmailErrorReportNotifier'

    App\Shared\Domain\Model\ErrorReport\ErrorReportThrottle: '@App\Shared\Infrastructure\ErrorReport\CacheErrorReportThrottle'

    App\Shared\Infrastructure\Symfony\Event\MaintenanceModeListener:
        arguments:
            $maintenanceMode: '%app.maintenance_mode%'

    App\Shared\Domain\Model\Sms\SmsSender: '@App\Shared\Infrastructure\Sms\TwilioSmsSender'

    App\Shared\Domain\Model\WhatsApp\WhatsAppSender: '@App\Shared\Infrastructure\WhatsApp\TwilioWhatsAppSender'
