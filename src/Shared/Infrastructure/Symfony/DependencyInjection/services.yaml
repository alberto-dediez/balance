parameters:
    app.locale_default: '%env(LANGUAGE_DEFAULT)%'
    app.locale_list: '%env(LANGUAGE_LIST)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Shared\Domain\Event\DomainEventSubscriber:
            tags: ['domain.event.subscriber']

    App\Shared\:
        resource: '../../../'

    App\Shared\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\DataFixtures\:
        resource: '../../../../../fixtures'
