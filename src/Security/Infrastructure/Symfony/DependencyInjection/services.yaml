parameters:
    app.signature_hmac_secret: '%env(SIGNATURE_HMAC_SECRET)%'
    app.signature_sms_enabled: '%env(bool:SIGNATURE_SMS_ENABLED)%'
    app.signature_whatsapp_enabled: '%env(bool:SIGNATURE_WHATSAPP_ENABLED)%'
    app.account_impersonation_enabled: '%env(bool:ACCOUNT_IMPERSONATION_ENABLED)%'
    app.sso_google_enabled: '%env(bool:SSO_GOOGLE_ENABLED)%'
    app.sso_microsoft_enabled: '%env(bool:SSO_MICROSOFT_ENABLED)%'
    app.two_factor_required: '%env(bool:TWO_FACTOR_REQUIRED)%'
    app.two_factor_sso_enabled: '%env(bool:TWO_FACTOR_SSO_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $smsEnabled: '%app.signature_sms_enabled%'
            $whatsappEnabled: '%app.signature_whatsapp_enabled%'
            $accountImpersonationEnabled: '%app.account_impersonation_enabled%'

    App\Security\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'
            - '../../../Infrastructure/Sso/InMemory/'
            - '../../../Infrastructure/Symfony/Security/TwoFactor/InMemoryTwoFactorPolicy.php'
            - '../../../Infrastructure/Symfony/Security/TwoFactor/InMemoryTotpAuthenticator.php'

    App\Security\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Shared\Application\CurrentAccount\CurrentAccountIdProvider:
        alias: App\Security\Infrastructure\Symfony\Security\LoggedAccount

    App\Shared\Application\CurrentRoles\CurrentRolesProvider:
        alias: App\Security\Infrastructure\Symfony\Security\CurrentRoles

    App\Security\Application\User\Register\RegisterUserService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'

    App\Security\Application\User\ChangePassword\ChangePasswordService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'

    App\Security\Application\User\RecoverPassword\RecoverPasswordService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'

    App\Security\Application\SignatureRequest\Register\RegisterSignatureRequestService:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'
            $smsEnabled: '%app.signature_sms_enabled%'
            $whatsappEnabled: '%app.signature_whatsapp_enabled%'

    App\Security\Infrastructure\Symfony\Form\RegisterSignatureRequestType:
        arguments:
            $smsEnabled: '%app.signature_sms_enabled%'
            $whatsappEnabled: '%app.signature_whatsapp_enabled%'
        tags: ['form.type']

    App\Security\Application\SignatureRequest\RecordView\RecordSignatureViewService:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'

    App\Security\Application\SignatureRequest\Sign\SignDocumentService:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'

    App\Security\Infrastructure\Pdf\HmacPdfSigner:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'

    App\Security\Infrastructure\FileStorage\LocalSignatureFileStorage:
        arguments:
            $uploadsDir: '%app.uploads_dir%'

    App\Security\Domain\Model\SignatureRequest\PdfSigner:
        alias: App\Security\Infrastructure\Pdf\HmacPdfSigner

    App\Security\Domain\Model\SignatureRequest\SignatureFileStorage:
        alias: App\Security\Infrastructure\FileStorage\LocalSignatureFileStorage

    App\Security\Infrastructure\UI\Web\Public\SignatureRequest\ViewSignatureController:
        arguments:
            $signatureTokenLimiter: '@limiter.signature_token'

    App\Security\Infrastructure\UI\Web\Public\SignatureRequest\SignDocumentController:
        arguments:
            $signatureTokenLimiter: '@limiter.signature_token'

    App\Security\Infrastructure\UI\Web\Public\SignatureRequest\StreamDocumentController:
        arguments:
            $signatureTokenLimiter: '@limiter.signature_token'

    App\Security\Infrastructure\UI\Web\Public\SignatureRequest\OtpController:
        arguments:
            $signatureTokenLimiter: '@limiter.signature_token'

    App\Security\Application\SignatureRequest\SendOtp\SendOtpService:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'
            $smsEnabled: '%app.signature_sms_enabled%'
            $whatsappEnabled: '%app.signature_whatsapp_enabled%'

    App\Security\Application\SignatureRequest\VerifyOtp\VerifyOtpService:
        arguments:
            $appSecret: '%app.signature_hmac_secret%'

    App\Shared\Domain\Model\Sms\SmsSender:
        alias: App\Shared\Infrastructure\Sms\InMemorySmsSender

    App\Shared\Domain\Model\WhatsApp\WhatsAppSender:
        alias: App\Shared\Infrastructure\WhatsApp\InMemoryWhatsAppSender

    App\Shared\Infrastructure\Storage\LocalFileUploader:
        arguments:
            $rootDir: '%app.uploads_dir%'

    App\Security\Infrastructure\Symfony\Security\SsoAuthenticator:
        arguments:
            $defaultLocale: '%app.locale_default%'

    App\Security\Infrastructure\UI\Web\Sso\SsoController:
        arguments:
            $defaultLocale: '%app.locale_default%'

    App\Security\Infrastructure\Symfony\Security\TwoFactor\EnvTwoFactorPolicy:
        arguments:
            $twoFactorRequired: '%app.two_factor_required%'
            $twoFactorSsoEnabled: '%app.two_factor_sso_enabled%'

    App\Security\Application\User\TwoFactor\TwoFactorPolicy:
        alias: App\Security\Infrastructure\Symfony\Security\TwoFactor\EnvTwoFactorPolicy

    App\Security\Infrastructure\Symfony\Security\TwoFactor\OtphpTotpAuthenticator:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Security\Domain\Model\User\TotpAuthenticator:
        alias: App\Security\Infrastructure\Symfony\Security\TwoFactor\OtphpTotpAuthenticator

    App\Security\Infrastructure\UI\Web\ProfileTwoFactorController:
        arguments:
            $issuer: '%company.name%'

    App\Security\Infrastructure\UI\Web\TwoFactorLoginController:
        arguments:
            $twoFactorCodeLimiter: '@limiter.two_factor_code'
            $defaultLocale: '%app.locale_default%'

    App\Security\Application\User\RequestTwoFactorChallenge\RequestTwoFactorChallengeService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Security\Application\User\VerifyTwoFactorChallenge\VerifyTwoFactorChallengeService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Security\Application\User\RequestTwoFactorEnrolment\RequestTwoFactorEnrolmentService:
        arguments:
            $issuer: '%company.name%'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Security\Infrastructure\Sso\OAuth2\GoogleSsoProvider:
            arguments:
                $enabled: '%app.sso_google_enabled%'

        App\Security\Infrastructure\Sso\OAuth2\MicrosoftSsoProvider:
            arguments:
                $enabled: '%app.sso_microsoft_enabled%'

when@prod:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Security\Infrastructure\Sso\OAuth2\GoogleSsoProvider:
            arguments:
                $enabled: '%app.sso_google_enabled%'

        App\Security\Infrastructure\Sso\OAuth2\MicrosoftSsoProvider:
            arguments:
                $enabled: '%app.sso_microsoft_enabled%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Security\Infrastructure\Sso\SsoProviderRegistry:
            public: true

        App\Security\Infrastructure\Symfony\Security\TwoFactor\InMemoryTwoFactorPolicy:
            public: true

        App\Security\Application\User\TwoFactor\TwoFactorPolicy:
            alias: App\Security\Infrastructure\Symfony\Security\TwoFactor\InMemoryTwoFactorPolicy
            public: true

        App\Security\Infrastructure\Symfony\Security\TwoFactor\InMemoryTotpAuthenticator:
            public: true

        App\Security\Domain\Model\User\TotpAuthenticator:
            alias: App\Security\Infrastructure\Symfony\Security\TwoFactor\InMemoryTotpAuthenticator
            public: true

        security.sso_provider.google:
            class: App\Security\Infrastructure\Sso\InMemory\InMemorySsoProvider
            arguments:
                $key: google
                $label: Google
            tags: ['security.sso_provider']

        security.sso_provider.microsoft:
            class: App\Security\Infrastructure\Sso\InMemory\InMemorySsoProvider
            arguments:
                $key: microsoft
                $label: Microsoft
            tags: ['security.sso_provider']
