parameters:
    bioscore_sso_url: '%env(BIOSCORE_SSO_URL)%'
    bioscore_sso_platform: '%env(BIOSCORE_SSO_PLATFORM)%'
    bioscore_api_url: '%env(BIOSCORE_API_URL)%'
    bioscore_jwt_public_key: '%env(resolve:BIOSCORE_JWT_PUBLIC_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Security\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'

    App\Security\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Security\Infrastructure\Bioscore\BioscoreSsoClient:
        arguments:
            $ssoUrl: '%bioscore_sso_url%'
            $apiBaseUrl: '%bioscore_api_url%'
            $platform: '%bioscore_sso_platform%'

    App\Security\Infrastructure\Bioscore\BioscoreJwtDecoder:
        arguments:
            $publicKeyPath: '%bioscore_jwt_public_key%'

    App\Security\Application\User\Register\RegisterUserService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'

    App\Security\Application\User\ChangePassword\ChangePasswordService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'

    App\Security\Application\User\RecoverPassword\RecoverPasswordService:
        arguments:
            $passwordHasher: '@App\Security\Infrastructure\Symfony\Security\UserPasswordHasher'
