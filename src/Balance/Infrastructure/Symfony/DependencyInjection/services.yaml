services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Balance\:
        resource: '../../../'
        exclude:
            - '../../../Infrastructure/Symfony/DependencyInjection/'
            - '../../../Infrastructure/LegacyImport/'

    App\Balance\Infrastructure\UI\Console\:
        resource: '../../../Infrastructure/UI/Console/'
        tags: ['console.command']

    App\Balance\Infrastructure\LegacyImport\:
        resource: '../../../Infrastructure/LegacyImport/'
        exclude:
            - '../../../Infrastructure/LegacyImport/{ImportDecisions,ImportOptions,LegacyBalanceDataset,LegacyCalculation,LegacyDonation,LegacyEcoProject,LegacyMembership,LegacyOrganization,LegacyPlace,LegacyUser,OrganizationDecision,OrganizationTarget,RedirectRule}.php'

    App\Balance\Infrastructure\UI\Console\LegacyImport\ImportLegacyBalanceCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Balance\Application\ProjectContribution\Register\RegisterProjectContributionService:
        arguments:
            $reservationHours: '%app.contribution.reservation_hours%'

    App\Balance\Application\ProjectContribution\Expire\ContributionExpirationScheduler: '@App\Balance\Infrastructure\Messenger\MessengerContributionExpirationScheduler'

    App\Balance\Application\ContributionCertificate\Generate\GenerateContributionCertificateService:
        arguments:
            $localeList: '%app.locale_list%'
            $documentAuthor: '%company.name%'

    App\Balance\Infrastructure\Tcpdf\ThemeAwareContributionCertificatePdfGenerator:
        arguments:
            $themeGenerators: !tagged_locator { tag: 'app.theme.certificate_generator', index_by: 'theme' }

    App\Balance\Infrastructure\Storage\LocalContributionCertificateStorage:
        arguments:
            $basePath: '%app.uploads_dir%/contribution-certificates'

    App\Balance\Infrastructure\UI\Web\Public\Certificate\VerifyController:
        arguments:
            $certificateVerificationLimiter: '@limiter.certificate_verification'
        tags: ['controller.service_arguments']

    App\Balance\Domain\Model\ContributionCertificate\ContributionCertificateStorage: '@App\Balance\Infrastructure\Storage\LocalContributionCertificateStorage'
    App\Balance\Domain\Model\ContributionCertificate\ContributionCertificatePdfGenerator: '@App\Balance\Infrastructure\Tcpdf\TcpdfContributionCertificatePdfGenerator'
    App\Balance\Domain\Model\ContributionCertificate\ContributionCertificateCodeGenerator: '@App\Balance\Infrastructure\Certificate\RandomContributionCertificateCodeGenerator'
    App\Balance\Domain\Model\ContributionCertificate\ContributionCertificateVerificationTokenGenerator: '@App\Balance\Infrastructure\Certificate\RandomContributionCertificateVerificationTokenGenerator'
    App\Balance\Domain\Model\ContributionCertificate\ContributionCertificateVerificationUrlGenerator: '@App\Balance\Infrastructure\Certificate\RouterContributionCertificateVerificationUrlGenerator'
    App\Payments\Domain\Model\Payee\PayeeSubjectDirectory: '@App\Balance\Infrastructure\Payee\AccountAndProjectPayeeSubjectDirectory'
    App\Payments\Domain\Model\Payout\PayoutStatementLinesProvider: '@App\Balance\Infrastructure\Payout\LedgerPayoutStatementLinesProvider'
    App\Payments\Infrastructure\UI\Web\Admin\Payee\PayeeSettlementProvider: '@App\Balance\Infrastructure\Payee\LedgerPayeeSettlementProvider'
